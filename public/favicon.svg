<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#1a3a2a"/>
      <stop offset="100%" stop-color="#2d5a3f"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="url(#bg)"/>
  <!-- Tree trunk -->
  <rect x="28" y="28" width="8" height="22" rx="2" fill="#c4963a"/>
  <!-- Roots -->
  <line x1="28" y1="48" x2="18" y2="54" stroke="#c4963a" stroke-width="3" stroke-linecap="round"/>
  <line x1="36" y1="48" x2="46" y2="54" stroke="#c4963a" stroke-width="3" stroke-linecap="round"/>
  <line x1="30" y1="50" x2="24" y2="56" stroke="#c4963a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="34" y1="50" x2="40" y2="56" stroke="#c4963a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Canopy - layered circles -->
  <circle cx="32" cy="17" r="12" fill="#4a9e5c" opacity="0.9"/>
  <circle cx="23" cy="22" r="10" fill="#3d8a4f" opacity="0.85"/>
  <circle cx="41" cy="22" r="10" fill="#3d8a4f" opacity="0.85"/>
  <circle cx="28" cy="14" r="8" fill="#5ab86e" opacity="0.8"/>
  <circle cx="38" cy="15" r="7" fill="#5ab86e" opacity="0.8"/>
  <!-- Highlight -->
